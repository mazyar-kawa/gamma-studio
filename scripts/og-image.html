<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Gamma Studio OG</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary: #7dd3fc;
        --fg: #f8fafc;
        --muted: rgba(226, 232, 240, 0.72);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #020810;
        color: var(--fg);
        font-family: "Open Sans", ui-sans-serif, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: geometricPrecision;
      }

      .canvas {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #020810;
      }

      .layer {
        position: absolute;
        inset: -100px;
      }

      .grain {
        position: absolute;
        inset: 0;
        opacity: 0.55;
        mix-blend-mode: overlay;
        pointer-events: none;
      }

      .vignette {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse 80% 70% at 38% 48%, transparent 20%, rgba(2, 8, 16, 0.35) 70%, rgba(2, 8, 16, 0.72) 100%),
          linear-gradient(90deg, rgba(2, 8, 16, 0.42) 0%, transparent 42%, rgba(2, 8, 16, 0.28) 100%);
        pointer-events: none;
      }

      .frame {
        position: absolute;
        inset: 18px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 28px;
        pointer-events: none;
      }

      .content {
        position: relative;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 100%;
        padding: 56px 64px 56px 72px;
      }

      .copy {
        width: 620px;
        flex-shrink: 0;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 36px;
      }

      .brand svg {
        width: 36px;
        height: 36px;
        display: block;
      }

      .brand-name {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.03em;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 7px 14px;
        border-radius: 999px;
        background: rgba(8, 16, 28, 0.45);
        border: 1px solid rgba(255, 255, 255, 0.14);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
        backdrop-filter: blur(16px);
        font-size: 14px;
        font-weight: 600;
        color: var(--muted);
        margin-bottom: 22px;
      }

      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #38bdf8;
        box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.22);
      }

      h1 {
        font-size: 58px;
        font-weight: 600;
        line-height: 1.04;
        letter-spacing: -0.045em;
        text-wrap: pretty;
      }

      h1 em {
        font-family: Georgia, "Times New Roman", serif;
        font-style: italic;
        font-weight: 400;
        color: var(--primary);
        letter-spacing: -0.02em;
        text-shadow: 0 0 42px rgba(125, 211, 252, 0.35);
      }

      .lede {
        margin-top: 22px;
        max-width: 480px;
        font-size: 20px;
        line-height: 1.45;
        color: var(--muted);
        font-weight: 400;
      }

      .meta {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 32px;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        height: 34px;
        padding: 0 14px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.12);
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.01em;
        color: rgba(241, 245, 249, 0.88);
      }

      .url {
        margin-top: 36px;
        font-size: 16px;
        font-weight: 600;
        letter-spacing: -0.01em;
        color: rgba(186, 230, 253, 0.78);
      }

      .previews {
        position: relative;
        width: 420px;
        height: 460px;
        flex-shrink: 0;
      }

      .card {
        position: absolute;
        width: 276px;
        height: 172px;
        border-radius: 22px;
        overflow: hidden;
        border: 1px solid rgba(255, 255, 255, 0.16);
        box-shadow:
          0 24px 60px rgba(0, 0, 0, 0.45),
          0 2px 0 rgba(255, 255, 255, 0.06) inset;
        background: #0a0a0a;
      }

      .card .swatch {
        position: absolute;
        inset: 0;
      }

      .card .swatch > i {
        position: absolute;
        inset: -40px;
        display: block;
      }

      .card .label {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
        padding: 28px 16px 14px;
        background: linear-gradient(to top, rgba(0, 0, 0, 0.62), rgba(0, 0, 0, 0.2) 55%, transparent);
      }

      .card .name {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: -0.02em;
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.55);
        white-space: nowrap;
      }

      .card .cat {
        font-size: 12px;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.72);
        white-space: nowrap;
      }

      .card-a {
        top: 22px;
        right: 10px;
        transform: rotate(7deg);
        z-index: 1;
      }

      .card-b {
        top: 148px;
        left: 0;
        transform: rotate(-6deg);
        z-index: 2;
      }

      .card-c {
        top: 286px;
        right: 8px;
        transform: rotate(3deg);
        z-index: 3;
        width: 272px;
        height: 180px;
      }
    </style>
  </head>
  <body>
    <div class="canvas">
      <!-- Sky Aurora — default landing background -->
      <div class="layer" style="background: #020810"></div>
      <div
        class="layer"
        style="
          background: linear-gradient(
            154deg,
            transparent 18%,
            rgba(10, 40, 70, 0.06) 29%,
            rgba(56, 189, 248, 0.55) 36%,
            rgb(255, 255, 255) 42%,
            rgba(96, 165, 250, 0.42) 48%,
            rgba(14, 116, 144, 0.22) 55%,
            rgba(125, 211, 252, 0.3) 62%,
            rgba(10, 50, 80, 0.08) 68%,
            transparent 82%
          );
          mix-blend-mode: screen;
          filter: blur(72px);
        "
      ></div>
      <div
        class="layer"
        style="
          background: linear-gradient(
            128deg,
            transparent 28%,
            rgba(15, 60, 90, 0.06) 38%,
            rgba(34, 211, 238, 0.35) 43%,
            rgb(255, 255, 255) 48%,
            rgba(96, 165, 250, 0.22) 52%,
            rgba(56, 189, 248, 0.25) 57%,
            rgba(20, 70, 100, 0.1) 62%,
            transparent 76%
          );
          mix-blend-mode: screen;
          filter: blur(64px);
          opacity: 0.9;
        "
      ></div>
      <div
        class="layer"
        style="
          background: radial-gradient(
            ellipse 78% 20% at 51% 53%,
            rgba(56, 189, 248, 0.24) 0%,
            rgba(30, 80, 120, 0.1) 45%,
            transparent 82%
          );
          mix-blend-mode: screen;
          filter: blur(56px);
          opacity: 0.9;
        "
      ></div>
      <div
        class="layer"
        style="
          background: radial-gradient(
            ellipse 48% 9% at 52% 50%,
            rgba(224, 242, 254, 0.14) 0%,
            rgba(125, 211, 252, 0.06) 45%,
            transparent 80%
          );
          mix-blend-mode: screen;
          filter: blur(90px);
        "
      ></div>
      <div
        class="layer"
        style="
          background: radial-gradient(
            ellipse 50% 28% at 72% 18%,
            rgba(186, 230, 253, 0.1) 0%,
            rgba(56, 189, 248, 0.04) 45%,
            transparent 82%
          );
          mix-blend-mode: screen;
          filter: blur(70px);
          opacity: 0.7;
        "
      ></div>
      <!-- Gamma brand orbs -->
      <div
        class="layer"
        style="
          background: radial-gradient(circle at 12% 88%, rgba(233, 66, 247, 0.22), transparent 36%);
          mix-blend-mode: screen;
          filter: blur(40px);
        "
      ></div>
      <div
        class="layer"
        style="
          background: radial-gradient(circle at 92% 12%, rgba(247, 164, 66, 0.18), transparent 32%);
          mix-blend-mode: screen;
          filter: blur(36px);
        "
      ></div>
      <div
        class="layer"
        style="
          background: radial-gradient(circle at 8% 18%, rgba(0, 138, 255, 0.2), transparent 34%);
          mix-blend-mode: screen;
          filter: blur(48px);
        "
      ></div>

      <svg class="grain" xmlns="http://www.w3.org/2000/svg">
        <filter id="grain">
          <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="4" stitchTiles="stitch" />
          <feColorMatrix
            type="matrix"
            values="0.181 0.608 0.061 0 0.075
                    0.181 0.608 0.061 0 0.075
                    0.181 0.608 0.061 0 0.075
                    0     0     0     1 0"
          />
        </filter>
        <rect width="100%" height="100%" filter="url(#grain)" />
      </svg>

      <div class="vignette"></div>
      <div class="frame"></div>

      <div class="content">
        <div class="copy">
          <div class="brand">
            <svg viewBox="0 0 1024 1024" aria-hidden="true">
              <path
                fill="#ffffff"
                fill-rule="evenodd"
                d="m440.24 578.67l-52.7 74.47 72.44 0.91-46.76 70.34-150.27 0.6 246.42-368.48 41.31 56.07-87.72 129.43 263.07 131.68 32.54 50.1-206.36 2.73-40.62 59.83 369.27 1.34-112.82-165.86-208.21-102.8 27.47-39.36 126.81 62.24-202.32-304.91-367.79 549.9 308.08 0.7 101.06-154.42z"
              />
            </svg>
            <span class="brand-name">Gamma Studio</span>
          </div>

          <div class="pill">
            <span class="dot"></span>
            Gamma Studio · 603+ patterns
          </div>

          <h1>
            Layer <em>ambient light</em><br />
            behind every interface.
          </h1>

          <p class="lede">
            Free CSS gradient generator. Browse, tune layers, and export CSS, Tailwind, or SVG in one click.
          </p>

          <div class="meta">
            <span class="chip">Aura</span>
            <span class="chip">Mesh</span>
            <span class="chip">Nebula</span>
            <span class="chip">Prism</span>
            <span class="chip">Aurora</span>
          </div>

          <p class="url">studio.gammaui.com</p>
        </div>

        <div class="previews">
          <div class="card card-a">
            <div class="swatch" style="background: #0a0c1a">
              <i
                style="
                  background: linear-gradient(
                    rgba(0, 0, 0, 0) 0%,
                    rgba(61, 90, 255, 0.22) 28%,
                    rgb(255, 255, 255) 18%,
                    rgb(45, 55, 135) 68%,
                    rgb(20, 25, 60) 100%
                  );
                  mix-blend-mode: hard-light;
                  filter: blur(28px);
                "
              ></i>
              <i
                style="
                  background: linear-gradient(
                    rgba(0, 0, 0, 0) 0%,
                    rgba(61, 90, 255, 0.32) 34%,
                    rgb(255, 255, 255) 66%,
                    rgb(45, 55, 135) 82%,
                    rgb(20, 25, 60) 100%
                  );
                  mix-blend-mode: soft-light;
                  filter: blur(24px);
                "
              ></i>
            </div>
            <div class="label">
              <span class="name">Midnight Sapphire</span>
              <span class="cat">Aura</span>
            </div>
          </div>

          <div class="card card-b">
            <div class="swatch" style="background: #faf8f2">
              <i
                style="
                  background: linear-gradient(
                    rgba(0, 0, 0, 0) 0%,
                    rgba(255, 183, 77, 0.18) 28%,
                    rgb(255, 255, 255) 18%,
                    rgb(255, 138, 61) 68%,
                    rgb(183, 77, 0) 100%
                  );
                  mix-blend-mode: multiply;
                  filter: blur(28px);
                "
              ></i>
              <i
                style="
                  background: linear-gradient(
                    rgba(0, 0, 0, 0) 0%,
                    rgba(255, 183, 77, 0.28) 34%,
                    rgb(255, 255, 255) 66%,
                    rgb(255, 138, 61) 82%,
                    rgb(183, 77, 0) 100%
                  );
                  mix-blend-mode: multiply;
                  filter: blur(22px);
                "
              ></i>
            </div>
            <div class="label">
              <span class="name">Golden Hour</span>
              <span class="cat">Aura</span>
            </div>
          </div>

          <div class="card card-c">
            <div class="swatch" style="background: #020810">
              <i
                style="
                  background: linear-gradient(
                    154deg,
                    transparent 18%,
                    rgba(56, 189, 248, 0.4) 36%,
                    rgb(255, 255, 255) 42%,
                    rgba(96, 165, 250, 0.32) 48%,
                    rgba(125, 211, 252, 0.3) 62%,
                    transparent 82%
                  );
                  mix-blend-mode: screen;
                  filter: blur(28px);
                "
              ></i>
              <i
                style="
                  background: linear-gradient(
                    128deg,
                    transparent 28%,
                    rgba(34, 211, 238, 0.35) 43%,
                    rgb(255, 255, 255) 48%,
                    rgba(56, 189, 248, 0.25) 57%,
                    transparent 76%
                  );
                  mix-blend-mode: screen;
                  filter: blur(22px);
                "
              ></i>
            </div>
            <div class="label">
              <span class="name">Sky Aurora</span>
              <span class="cat">Nebula</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
